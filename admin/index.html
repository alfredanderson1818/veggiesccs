<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veggies CCS · Acceso</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%231f8f37' d='M27 5C15 5 8 12 8 22c0 1 0 2 .3 3C5 22 5 16 5 16S2 24 7 28c2 1.6 5 1.8 7.6 1.2C24 27 28 17 27 5z'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-width='1.6' stroke-linecap='round' d='M22 11c-6 3-9 8-10 15'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --green:#1f8f37; --green-deep:#0e5c25; --cream:#f5f9ef; --ink:#16241a; --muted:#5d6b5f; --line:#dfe7d6; --red:#d84b5d; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family:"Plus Jakarta Sans",sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:20px; -webkit-font-smoothing:antialiased; }
      .blob { position:fixed; border-radius:50%; filter:blur(80px); opacity:.4; z-index:0; }
      .blob.a { width:480px; height:480px; background:#bfe6a8; top:-180px; right:-120px; }
      .blob.b { width:420px; height:420px; background:#a7e0c0; bottom:-180px; left:-140px; }
      .card { position:relative; z-index:1; width:min(420px,100%); background:#fff; border:1px solid var(--line); border-radius:22px; padding:38px 34px; box-shadow:0 30px 70px rgba(16,58,29,.14); }
      .logo { display:block; height:86px; margin:0 auto 18px; }
      h1 { font-family:"Fraunces",serif; font-size:26px; text-align:center; letter-spacing:-.01em; }
      .sub { text-align:center; color:var(--muted); font-size:14px; margin:8px 0 26px; }
      label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:7px; }
      input { width:100%; padding:13px 15px; border:1.5px solid var(--line); border-radius:12px; font:inherit; background:#fff; color:var(--ink); }
      input:focus { outline:none; border-color:var(--green); }
      .field { margin-bottom:16px; }
      button { width:100%; padding:14px; border:0; border-radius:12px; background:var(--green); color:#fff; font-weight:700; font-size:16px; cursor:pointer; box-shadow:0 10px 24px rgba(31,143,55,.28); transition:transform .15s; }
      button:hover { transform:translateY(-2px); }
      .err { color:var(--red); font-size:13px; text-align:center; margin-top:14px; min-height:18px; font-weight:600; }
      .back { display:block; text-align:center; margin-top:20px; color:var(--muted); font-size:13px; text-decoration:none; }
      .back:hover { color:var(--green); }
    </style>
  </head>
  <body>
    <div class="blob a"></div>
    <div class="blob b"></div>
    <form class="card" id="loginForm" autocomplete="off">
      <img class="logo" src="/src/assets/logo-veggies.png" alt="Veggies CCS" />
      <h1>Acceso al sistema</h1>
      <p class="sub">Panel administrativo de Veggies CCS</p>
      <div class="field">
        <label for="user">Usuario</label>
        <input id="user" type="text" placeholder="admin" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit">Entrar</button>
      <div class="err" id="err"></div>
      <a class="back" href="/">← Volver a la página</a>
    </form>

    <script>
      // ⚠️ Acceso temporal del lado del cliente (hasta conectar Firebase con login real).
      // Cambia estas credenciales por las tuyas:
      var USERS = { admin: 'veggies2026' };

      document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var u = document.getElementById('user').value.trim().toLowerCase();
        var p = document.getElementById('pass').value;
        if (USERS[u] && USERS[u] === p) {
          sessionStorage.setItem('veggies_auth', 'ok');
          sessionStorage.setItem('veggies_user', u);
          location.href = 'sistema/';
        } else {
          document.getElementById('err').textContent = 'Usuario o contraseña incorrectos.';
        }
      });
      // Si ya tiene sesion, pasa directo.
      if (sessionStorage.getItem('veggies_auth') === 'ok') location.replace('sistema/');
    </script>
  </body>
</html>
